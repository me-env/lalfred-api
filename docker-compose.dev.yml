services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lalfred
      POSTGRES_PASSWORD: lalfred_dev
      POSTGRES_DB: lalfred
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lalfred"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-include '*.py' --reload-include '.env.dev'
    env_file:
      - .env.dev
    environment:
      OTEL_PYTHON_LOG_CORRELATION: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./.env:/code/.env:ro

volumes:
  pgdata:
